name: "Check port label"

# Every PR must state whether its change needs to be ported to the other development branch
# (`2.x` <-> `main`) or to a maintenance branch. See:
# https://github.com/apache/logging-log4j2/issues/3161
#
# Accepted labels:
#
# - `port-to-*` (e.g. `port-to-main`, `port-to-2.x`, `port-to-2.26.x`): a port is still needed.
# - `port-done`: nothing more to port, either because every port is merged or because none was needed.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

# Default permissions for each job.
# Additional permissions should be assigned on a per-job basis.
permissions: { }

jobs:

  check-port-label:
    name: "Check port label"
    runs-on: ubuntu-slim
    steps:
      - name: Require a `port-to-*` or `port-done` label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
        shell: bash
        run: |
          if printf '%b\n' "$LABELS" | grep -qE '^(port-to-.+|port-done)$'; then
            echo "Port label found."
          else
            echo "::error::Add a \`port-to-<branch>\` label if this change must be ported to another branch, or \`port-done\` if no port is needed. See https://github.com/apache/logging-log4j2/issues/3161"
            exit 1
          fi
