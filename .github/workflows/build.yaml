name: build

on:
  push:
    branches:
      - "2.x"
      - "2.25.x"
      - "release/2*"
  pull_request:
    types:
      # Standard types
      - opened
      - synchronize
      - reopened
      # Used in Dependabot PRs to retrigger required workflows
      - ready_for_review

# Cancel in-progress runs when a newer commit lands on the same PR; pushes to 2.x run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:

  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dependency-check-data-${{ runner.os }}-${{ hashFiles('dependency-check-suppressions.xml', 'log4j-parent/pom.xml', 'pom.xml') }}
          restore-keys: |
            owasp-dependency-check-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Powasp-check -N verify

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  build:
    uses: apache/logging-parent/.github/workflows/build-reusable.yaml@gha/v0
    with:
      java-version: |
        17
        21
        25
      site-enabled: true
      reproducibility-check-enabled: false

  deploy-snapshot:
    needs: build
    if: github.repository == 'apache/logging-log4j2' && github.ref_name == '2.x'
    uses: apache/logging-parent/.github/workflows/deploy-snapshot-reusable.yaml@gha/v0
    # Secrets for deployments
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PW }}
    with:
      java-version: |
        17

  deploy-release:
    needs: build
    if: github.repository == 'apache/logging-log4j2' && startsWith(github.ref_name, 'release/')
    uses: apache/logging-parent/.github/workflows/deploy-release-reusable.yaml@gha/v0
    # Secrets for deployments
    secrets:
      GPG_SECRET_KEY: ${{ secrets.LOGGING_GPG_SECRET_KEY }}
      NEXUS_USERNAME: ${{ secrets.LOGGING_STAGE_DEPLOYER_USER }}
      NEXUS_PASSWORD: ${{ secrets.LOGGING_STAGE_DEPLOYER_PW }}
      SVN_USERNAME: ${{ secrets.LOGGING_SVN_DEV_USERNAME }}
      SVN_PASSWORD: ${{ secrets.LOGGING_SVN_DEV_PASSWORD }}
    # Write permissions to allow the Maven `revision` property update, changelog release, etc.
    permissions:
      contents: write
    with:
      java-version: |
        17
      project-id: log4j

  verify-reproducibility-snapshot:
    needs: deploy-snapshot
    uses: apache/logging-parent/.github/workflows/verify-reproducibility-reusable.yaml@gha/v0
    with:
      # Name of the artifact uploaded by `deploy-snapshot`
      reference-artifact-name: ${{ needs.deploy-snapshot.outputs.repository-artifact-name }}
      # Encode the `runs-on` input as JSON array
      runs-on: '["ubuntu-latest", "macos-latest"]'

  verify-reproducibility-release:
    needs: deploy-release
    uses: apache/logging-parent/.github/workflows/verify-reproducibility-reusable.yaml@gha/v0
    with:
      # URL of staging repository
      nexus-url: ${{ needs.deploy-release.outputs.nexus-url }}
      # Encode the `runs-on` input as JSON array
      runs-on: '["ubuntu-latest", "macos-latest"]'

  # Run integration-tests automatically after a snapshot is published
  integration-test-snapshot:
    needs: deploy-snapshot
    uses: apache/logging-log4j-samples/.github/workflows/integration-test.yaml@main
    with:
      log4j-version: ${{ needs.deploy-snapshot.outputs.project-version }}
      # Use the `main` branch of `logging-log4j-samples`
      samples-ref: 'refs/heads/main'

  # Run integration-tests automatically after an RC is published
  integration-test-release:
    needs: deploy-release
    uses: apache/logging-log4j-samples/.github/workflows/integration-test.yaml@main
    with:
      log4j-version: ${{ needs.deploy-release.outputs.project-version }}
      # URL of the staging repository
      log4j-repository-url: ${{ needs.deploy-release.outputs.nexus-url }}
      # Use the `main` branch of `logging-log4j-samples`
      samples-ref: 'refs/heads/main'
