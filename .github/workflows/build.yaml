name: build

on:
  push:
    branches:
      - "2.x"
      - "2.25.x"
      - "release/2*"
  pull_request:
    types:
      # Standard types
      - opened
      - synchronize
      - reopened
      # Used in Dependabot PRs to retrigger required workflows
      - ready_for_review

# Cancel in-progress runs when a newer commit lands on the same PR; pushes to 2.x run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

# Build time guardrail (WO-057): baseline is the median wall-clock duration of five consecutive
# runs on the 2.x branch before modernization (~15 minutes). Update BUILD_TIME_BASELINE_SECONDS
# when intentional build scope changes (new modules, CI gates, JDK matrix expansion).
env:
  BUILD_TIME_BASELINE_SECONDS: 900

jobs:

  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dependency-check-data-${{ runner.os }}-${{ hashFiles('dependency-check-suppressions.xml', 'log4j-parent/pom.xml', 'pom.xml') }}
          restore-keys: |
            owasp-dependency-check-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Powasp-check -N verify

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  jakarta-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify Jakarta module variants
        run: |
          ./mvnw -B verify \
            -pl log4j-jakarta-web,log4j-jakarta-jms,log4j-jakarta-smtp,log4j-jakarta-jpa \
            -am

      - name: Check Jakarta modules for javax/jakarta classpath conflicts
        run: |
          ./mvnw -B dependency:tree \
            -pl log4j-jakarta-web,log4j-jakarta-jms,log4j-jakarta-smtp,log4j-jakarta-jpa \
            -Dverbose=false \
            | tee jakarta-dependency-tree.txt
          if grep -E 'javax\.(servlet|mail|jms|persistence):' jakarta-dependency-tree.txt; then
            echo "::error::Jakarta modules must not depend on legacy javax APIs"
            exit 1
          fi

  build-time-start:
    runs-on: ubuntu-latest
    outputs:
      start-epoch: ${{ steps.start.outputs.epoch }}
    steps:
      - name: Record build start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  build:
    needs: build-time-start
    uses: apache/logging-parent/.github/workflows/build-reusable.yaml@gha/v0
    with:
      java-version: |
        17
        21
        25
      site-enabled: true
      reproducibility-check-enabled: false

  build-time-report:
    needs: [build-time-start, build]
    if: always() && needs.build-time-start.result == 'success'
    runs-on: ubuntu-latest
    env:
      BUILD_START_EPOCH: ${{ needs.build-time-start.outputs.start-epoch }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Report build time and check baseline
        env:
          BASELINE_SECONDS: ${{ env.BUILD_TIME_BASELINE_SECONDS }}
        run: |
          END_EPOCH=$(date +%s)
          DURATION=$((END_EPOCH - BUILD_START_EPOCH))
          THRESHOLD=$((BASELINE_SECONDS * 110 / 100))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          BASELINE_MINUTES=$((BASELINE_SECONDS / 60))
          THRESHOLD_MINUTES=$((THRESHOLD / 60))

          {
            echo "## Build Time Report"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Total wall-clock time | ${MINUTES}m ${SECONDS}s (${DURATION}s) |"
            echo "| Baseline | ${BASELINE_MINUTES}m (${BASELINE_SECONDS}s) |"
            echo "| Warning threshold (110%) | ${THRESHOLD_MINUTES}m (${THRESHOLD}s) |"
            echo "| Build result | ${BUILD_RESULT} |"
            echo "| JDK matrix | 17, 21, 25 |"
            echo
            echo "Per-JDK timings are available in the reusable build job details in the workflow run UI."
            echo
            echo "Recorded at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DURATION" -gt "$THRESHOLD" ]; then
            echo "::warning title=Build time regression::Build took ${DURATION}s, exceeding 110% of the ${BASELINE_SECONDS}s baseline (threshold: ${THRESHOLD}s)."
          fi

  aggregate-test-results:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-report-ubuntu-latest-*
          merge-multiple: true
          path: .

      - name: Aggregate test results
        run: ./tools/aggregate-test-results.sh

  deploy-snapshot:
    needs: build
    if: github.repository == 'apache/logging-log4j2' && github.ref_name == '2.x'
    uses: apache/logging-parent/.github/workflows/deploy-snapshot-reusable.yaml@gha/v0
    # Secrets for deployments
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PW }}
    with:
      java-version: |
        17

  deploy-release:
    needs: build
    if: github.repository == 'apache/logging-log4j2' && startsWith(github.ref_name, 'release/')
    uses: apache/logging-parent/.github/workflows/deploy-release-reusable.yaml@gha/v0
    # Secrets for deployments
    secrets:
      GPG_SECRET_KEY: ${{ secrets.LOGGING_GPG_SECRET_KEY }}
      NEXUS_USERNAME: ${{ secrets.LOGGING_STAGE_DEPLOYER_USER }}
      NEXUS_PASSWORD: ${{ secrets.LOGGING_STAGE_DEPLOYER_PW }}
      SVN_USERNAME: ${{ secrets.LOGGING_SVN_DEV_USERNAME }}
      SVN_PASSWORD: ${{ secrets.LOGGING_SVN_DEV_PASSWORD }}
    # Write permissions to allow the Maven `revision` property update, changelog release, etc.
    permissions:
      contents: write
    with:
      java-version: |
        17
      project-id: log4j

  verify-reproducibility-snapshot:
    needs: deploy-snapshot
    uses: apache/logging-parent/.github/workflows/verify-reproducibility-reusable.yaml@gha/v0
    with:
      # Name of the artifact uploaded by `deploy-snapshot`
      reference-artifact-name: ${{ needs.deploy-snapshot.outputs.repository-artifact-name }}
      # Encode the `runs-on` input as JSON array
      runs-on: '["ubuntu-latest", "macos-latest"]'

  verify-reproducibility-release:
    needs: deploy-release
    uses: apache/logging-parent/.github/workflows/verify-reproducibility-reusable.yaml@gha/v0
    with:
      # URL of staging repository
      nexus-url: ${{ needs.deploy-release.outputs.nexus-url }}
      # Encode the `runs-on` input as JSON array
      runs-on: '["ubuntu-latest", "macos-latest"]'

  # Run integration-tests automatically after a snapshot is published
  integration-test-snapshot:
    needs: deploy-snapshot
    uses: apache/logging-log4j-samples/.github/workflows/integration-test.yaml@main
    with:
      log4j-version: ${{ needs.deploy-snapshot.outputs.project-version }}
      # Use the `main` branch of `logging-log4j-samples`
      samples-ref: 'refs/heads/main'

  # Run integration-tests automatically after an RC is published
  integration-test-release:
    needs: deploy-release
    uses: apache/logging-log4j-samples/.github/workflows/integration-test.yaml@main
    with:
      log4j-version: ${{ needs.deploy-release.outputs.project-version }}
      # URL of the staging repository
      log4j-repository-url: ${{ needs.deploy-release.outputs.nexus-url }}
      # Use the `main` branch of `logging-log4j-samples`
      samples-ref: 'refs/heads/main'
