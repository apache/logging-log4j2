name: deploy-site

on:
  push:
    # A minor version branch only stages the website for its own release branches.
    # The staging site for `2.x` and the production site (from `2.x-site-pro`) are deployed by the workflow on `2.x`.
    branches:
      - "release/2.25.*"

permissions: read-all

jobs:

  export-version:
    if: github.repository == 'apache/logging-log4j2'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.export-version.outputs.version }}
    steps:
      - name: Export version
        id: export-version
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^release\///')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deploy-site-rel:
    needs: export-version
    uses: apache/logging-parent/.github/workflows/deploy-site-reusable.yaml@gha/v0
    # Secrets for committing the generated site
    secrets:
      GPG_SECRET_KEY: ${{ secrets.LOGGING_GPG_SECRET_KEY }}
    # Write permissions for committing the generated site
    permissions:
      contents: write
    with:
      asf-yaml-content: |
        staging:
          profile: ~
          whoami: ${{ github.ref_name }}-site-stg-out
          subdir: content/log4j/${{ needs.export-version.outputs.version }}
      install-required: true
      target-branch: ${{ github.ref_name }}-site-stg-out
