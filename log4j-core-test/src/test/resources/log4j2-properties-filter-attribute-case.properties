# Reproduces https://github.com/apache/logging-log4j2/issues/2791: `onMisMatch` is spelled with a case
# that differs from the `onMismatch` attribute declared by the filter plugin.

status = ERROR
name = PropertiesFilterAttributeCase

appender.list.type = List
appender.list.name = List

logger.rules.name = com.example.rules
logger.rules.level = OFF
logger.rules.appenderRef.list.ref = List
logger.rules.filter.marker.type = MarkerFilter
logger.rules.filter.marker.marker = FULL_PLAN
logger.rules.filter.marker.onMatch = DENY
logger.rules.filter.marker.onMisMatch = ACCEPT

rootLogger.level = ERROR
